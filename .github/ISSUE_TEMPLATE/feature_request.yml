name: Feature request
description: Suggest an improvement for Codex Focus Windows
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for feature requests related to Codex Desktop, Douyin auto switch, Windows automation, or AI coding productivity workflows.
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What workflow should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Codex Focus Windows do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Codex task detection
        - Douyin playback control
        - Window detection
        - Settings
        - Documentation
        - Other media app
        - Other